services:
  comfyui:
    image: ${COMFYUI_IMAGE:-ghcr.io/ai-dock/comfyui:latest-cuda}
    container_name: ${COMFYUI_CONTAINER_NAME:-openmontage-comfyui}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      - CLI_ARGS=${COMFYUI_ARGS:---listen 0.0.0.0 --port 8188}
    volumes:
      - ${COMFYUI_WORKSPACE:-/home/pop/ComfyUI}/models:/workspace/ComfyUI/models
      - ${COMFYUI_WORKSPACE:-/home/pop/ComfyUI}/input:/workspace/ComfyUI/input
      - ${COMFYUI_WORKSPACE:-/home/pop/ComfyUI}/output:/workspace/ComfyUI/output
      - ${COMFYUI_WORKSPACE:-/home/pop/ComfyUI}/custom_nodes:/workspace/ComfyUI/custom_nodes
      - ${OPENMONTAGE_ROOT:-/home/pop/repos/openmontage-asymmetric}/channels/modern-archivist/assets/source/comfyui_generated:/workspace/openmontage/channels/modern-archivist/assets/source/comfyui_generated
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5).read()\nPY"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s
