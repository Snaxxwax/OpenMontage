services:
  comfyui:
    build:
      context: ./docker/comfyui
    image: openmontage-comfyui-local
    container_name: ${COMFYUI_CONTAINER_NAME:-openmontage-comfyui}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      - COMFYUI_ARGS=--listen 0.0.0.0 --port 8188
    volumes:
      - ${COMFYUI_WORKSPACE:-/home/pop/ComfyUI}/models:/opt/ComfyUI/models
      - ${COMFYUI_WORKSPACE:-/home/pop/ComfyUI}/input:/opt/ComfyUI/input
      - ${COMFYUI_WORKSPACE:-/home/pop/ComfyUI}/output:/opt/ComfyUI/output
      - ${COMFYUI_WORKSPACE:-/home/pop/ComfyUI}/custom_nodes:/opt/ComfyUI/custom_nodes
      - ${OPENMONTAGE_ROOT:-/home/pop/repos/openmontage-asymmetric}/channels/modern-archivist/assets/source/comfyui_generated:/opt/ComfyUI/output/comfyui_generated
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5).read()\nPY"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 60s
