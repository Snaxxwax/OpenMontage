# OpenMontage - Global Configuration

llm:
  provider: ollama               # anthropic | openai | gemini | openrouter | ollama | mistral | minimax
  model: qwen3-coder:latest      # best tested local fit: clean completions, long context, tool support
  temperature: 0.7
  max_tokens: 4096

research_agent:
  provider: null                 # null = use native pipeline web research
  executable: gemini
  model: null
  prompt_mode: headless
  approval_mode: plan
  output_format: text

routing:
  video_providers_allowed:
    - pexels
    - pixabay
  tts_providers_allowed:
    - fish_speech
    - elevenlabs

budget:
  mode: warn                     # observe | warn | cap
  total_usd: 10.00
  reserve_pct: 0.10              # holdback for retries / cleanup
  single_action_approval_usd: 0.50
  require_approval_for_new_paid_tool: true

checkpoint:
  policy: guided                 # guided | manual_all | auto_noncreative
  storage_dir: pipeline          # relative to project root

output:
  default_format: mp4
  default_codec: libx264
  default_audio_codec: aac
  default_resolution: "1920x1080"
  default_fps: 30
  default_crf: 23

paths:
  pipeline_dir: pipeline
  library_dir: library
  styles_dir: styles
  skills_dir: skills
  output_dir: output
