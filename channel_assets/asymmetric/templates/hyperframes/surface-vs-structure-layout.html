<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="scene-layout.css">
  <link rel="stylesheet" href="surface-vs-structure-layout.css">
</head>
<body>
  <div data-composition-id="surface-vs-structure-layout" data-width="1920" data-height="1080" data-start="0" data-duration="5" class="clip">
    <div class="scene-container">
      <div class="background-grid"></div>
      <div class="foreground-content">

        <!-- ══════════════════════════════════════════════════════ -->
        <!-- LEFT PANEL: SURFACE — what people see -->
        <!-- ══════════════════════════════════════════════════════ -->
        <div class="panel surface-panel">
          <div class="panel-tag surface-tag">SURFACE STORY</div>
          <h2 class="panel-title text-muted">WHAT PEOPLE SEE</h2>
          <div class="panel-content">
            <svg viewBox="0 0 540 460" fill="none" xmlns="http://www.w3.org/2000/svg">

              <!-- App store grid: visible market with many competitors -->
              <text x="270" y="34" fill="#8C7A68" text-anchor="middle" font-family="IBM Plex Mono" font-size="14">OPEN COMPETITIVE MARKET</text>

              <!-- Row 1: 3 app tiles -->
              <rect x="30" y="50" width="140" height="100" fill="#D4CBBA" rx="6"/>
              <rect x="30" y="50" width="140" height="28" fill="#1D6A8C" opacity="0.6" rx="6"/>
              <text x="100" y="110" fill="#1A1208" text-anchor="middle" font-family="IBM Plex Mono" font-size="13">APP A</text>
              <text x="100" y="128" fill="#8C7A68" text-anchor="middle" font-family="IBM Plex Mono" font-size="11">4.8 ★  FREE</text>

              <rect x="200" y="50" width="140" height="100" fill="#D4CBBA" rx="6"/>
              <rect x="200" y="50" width="140" height="28" fill="#1D6A8C" opacity="0.6" rx="6"/>
              <text x="270" y="110" fill="#1A1208" text-anchor="middle" font-family="IBM Plex Mono" font-size="13">APP B</text>
              <text x="270" y="128" fill="#8C7A68" text-anchor="middle" font-family="IBM Plex Mono" font-size="11">4.6 ★  $2.99</text>

              <rect x="370" y="50" width="140" height="100" fill="#D4CBBA" rx="6"/>
              <rect x="370" y="50" width="140" height="28" fill="#1D6A8C" opacity="0.6" rx="6"/>
              <text x="440" y="110" fill="#1A1208" text-anchor="middle" font-family="IBM Plex Mono" font-size="13">APP C</text>
              <text x="440" y="128" fill="#8C7A68" text-anchor="middle" font-family="IBM Plex Mono" font-size="11">4.7 ★  FREE</text>

              <!-- Row 2: 3 more app tiles -->
              <rect x="30" y="170" width="140" height="100" fill="#D4CBBA" rx="6"/>
              <rect x="30" y="170" width="140" height="28" fill="#8C7A68" opacity="0.4" rx="6"/>
              <text x="100" y="230" fill="#1A1208" text-anchor="middle" font-family="IBM Plex Mono" font-size="13">APP D</text>
              <text x="100" y="248" fill="#8C7A68" text-anchor="middle" font-family="IBM Plex Mono" font-size="11">4.3 ★  $4.99</text>

              <rect x="200" y="170" width="140" height="100" fill="#D4CBBA" rx="6"/>
              <rect x="200" y="170" width="140" height="28" fill="#8C7A68" opacity="0.4" rx="6"/>
              <text x="270" y="230" fill="#1A1208" text-anchor="middle" font-family="IBM Plex Mono" font-size="13">APP E</text>
              <text x="270" y="248" fill="#8C7A68" text-anchor="middle" font-family="IBM Plex Mono" font-size="11">4.5 ★  FREE</text>

              <rect x="370" y="170" width="140" height="100" fill="#D4CBBA" rx="6"/>
              <rect x="370" y="170" width="140" height="28" fill="#8C7A68" opacity="0.4" rx="6"/>
              <text x="440" y="230" fill="#1A1208" text-anchor="middle" font-family="IBM Plex Mono" font-size="13">APP F</text>
              <text x="440" y="248" fill="#8C7A68" text-anchor="middle" font-family="IBM Plex Mono" font-size="11">4.2 ★  $0.99</text>

              <!-- Separator -->
              <line x1="0" y1="302" x2="540" y2="302" stroke="#D4CBBA" stroke-width="1"/>

              <!-- Summary labels -->
              <text x="30" y="330" fill="#8C7A68" font-family="IBM Plex Mono" font-size="13">APPARENT CHOICE:</text>
              <text x="30" y="352" fill="#1A1208" font-family="IBM Plex Mono" font-size="15" font-weight="700">MILLIONS OF APPS</text>

              <text x="30" y="386" fill="#8C7A68" font-family="IBM Plex Mono" font-size="13">APPARENT STRUCTURE:</text>
              <text x="30" y="408" fill="#1A1208" font-family="IBM Plex Mono" font-size="15" font-weight="700">FREE MARKET COMPETITION</text>

              <text x="30" y="442" fill="#8C7A68" font-family="IBM Plex Mono" font-size="13">OBSERVED PRICING:</text>
              <text x="250" y="442" fill="#1A1208" font-family="IBM Plex Mono" font-size="15" font-weight="700">VARIES FREELY</text>

            </svg>
          </div>
        </div>

        <!-- ── CENTER DIVIDER ── -->
        <div class="panel-divider">
          <div class="divider-line"></div>
          <div class="divider-label">VS</div>
          <div class="divider-line"></div>
        </div>

        <!-- ══════════════════════════════════════════════════════ -->
        <!-- RIGHT PANEL: STRUCTURE — what actually controls it -->
        <!-- ══════════════════════════════════════════════════════ -->
        <div class="panel structure-panel">
          <div class="panel-tag structure-tag">ACTUAL STRUCTURE</div>
          <h2 class="panel-title text-cyan">WHAT CONTROLS IT</h2>
          <div class="panel-content">
            <svg viewBox="0 0 540 460" fill="none" xmlns="http://www.w3.org/2000/svg">

              <text x="270" y="34" fill="#1D6A8C" text-anchor="middle" font-family="IBM Plex Mono" font-size="14">SINGLE CHOKEPOINT CONTROLS ALL ACCESS</text>

              <!-- The platform control node (amber, large) -->
              <rect x="175" y="50" width="190" height="80" fill="#C94B00" rx="4"/>
              <text x="270" y="87" fill="#FFF8F0" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="18" font-weight="700">APP STORE</text>
              <text x="270" y="108" fill="#FFF8F0" text-anchor="middle" font-family="IBM Plex Mono" font-size="13">PLATFORM GATEKEEPER</text>

              <!-- Down-flow to all apps showing the gate -->
              <path d="M270 130 V165" stroke="#C94B00" stroke-width="3"/>
              <polygon points="265,165 270,180 275,165" fill="#C94B00"/>

              <!-- Gate bar: the actual control mechanism -->
              <rect x="30" y="180" width="480" height="36" fill="#D4CBBA" rx="3"/>
              <rect x="30" y="180" width="5" height="36" fill="#C94B00" rx="2"/>
              <text x="275" y="204" fill="#C94B00" text-anchor="middle" font-family="IBM Plex Mono" font-size="14" font-weight="700">MANDATORY REVIEW · 30% TAKE RATE · TERMS OF SERVICE</text>

              <!-- Output nodes: all apps flow THROUGH the gate -->
              <path d="M100 216 V258" stroke="#1D6A8C" stroke-width="2" stroke-dasharray="4 3"/>
              <polygon points="95,258 100,270 105,258" fill="#1D6A8C"/>
              <path d="M270 216 V258" stroke="#1D6A8C" stroke-width="2" stroke-dasharray="4 3"/>
              <polygon points="265,258 270,270 275,258" fill="#1D6A8C"/>
              <path d="M440 216 V258" stroke="#1D6A8C" stroke-width="2" stroke-dasharray="4 3"/>
              <polygon points="435,258 440,270 445,258" fill="#1D6A8C"/>

              <!-- Apps (now shown as controlled outputs, not competitors) -->
              <rect x="30" y="270" width="130" height="52" fill="#D4CBBA" rx="3"/>
              <text x="95" y="295" fill="#8C7A68" text-anchor="middle" font-family="IBM Plex Mono" font-size="12">APP A</text>
              <text x="95" y="312" fill="#8C7A68" text-anchor="middle" font-family="IBM Plex Mono" font-size="11">APPROVED</text>

              <rect x="200" y="270" width="140" height="52" fill="#D4CBBA" rx="3"/>
              <text x="270" y="295" fill="#8C7A68" text-anchor="middle" font-family="IBM Plex Mono" font-size="12">APP B</text>
              <text x="270" y="312" fill="#8C7A68" text-anchor="middle" font-family="IBM Plex Mono" font-size="11">APPROVED</text>

              <rect x="380" y="270" width="130" height="52" fill="#D4CBBA" rx="3"/>
              <text x="445" y="295" fill="#B8291A" text-anchor="middle" font-family="IBM Plex Mono" font-size="12">APP X</text>
              <text x="445" y="312" fill="#B8291A" text-anchor="middle" font-family="IBM Plex Mono" font-size="11">BANNED</text>

              <!-- Separator -->
              <line x1="0" y1="354" x2="540" y2="354" stroke="#D4CBBA" stroke-width="1"/>

              <!-- Actual structural labels -->
              <text x="30" y="382" fill="#8C7A68" font-family="IBM Plex Mono" font-size="13">ACTUAL CHOICE:</text>
              <text x="30" y="404" fill="#C94B00" font-family="IBM Plex Mono" font-size="15" font-weight="700">WHAT PLATFORM ALLOWS</text>

              <text x="30" y="430" fill="#8C7A68" font-family="IBM Plex Mono" font-size="13">ACTUAL STRUCTURE:</text>
              <text x="250" y="430" fill="#C94B00" font-family="IBM Plex Mono" font-size="15" font-weight="700">30% TOLL ON ALL REVENUE</text>

            </svg>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["surface-vs-structure-layout"] = tl;
  </script>
</body>
</html>
