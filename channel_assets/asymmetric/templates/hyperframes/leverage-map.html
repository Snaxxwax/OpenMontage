            <text x="252" y="690" fill="#1D6A8C" text-anchor="end" font-family="IBM Plex Mono" font-size="11" font-weight="700">LIMITED</text>

    const tl = gsap.timeline({ paused: true });
    window.__timelines["leverage-map"] = tl;

</body>
</html>
