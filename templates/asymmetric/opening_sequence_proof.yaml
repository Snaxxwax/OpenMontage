operator_approval_notes: ""

---

# Opening sequence gate requirements (all must pass for PASS decision)
gate_requirements:
  first_frame_rule:
    description: "First frame must create curiosity, pressure, consequence, conflict, or visual novelty. Not a title card."
    test: "Would a viewer who landed at t=0 stop scrolling before the third second?"

  no_title_card_opening:
    description: "The opening sequence must not begin with a clean title card, logo, or channel intro."
    test: "Does the first frame contain a visual that is not the channel logo or a text-only card?"

  no_context_dump:
    description: "The first 10 seconds must not be context-building narration. Tension first."
    test: "Is the first narration line a concrete fact, conflict, consequence, or constraint — not a topic introduction?"

  stakes_appear_early:
    description: "Viewer stakes (person, number, institution, consequence) visible by second 8."
    test: "By t=8, does the viewer know what is at risk and for whom?"

  viewer_question_created_early:
    description: "A viewer question — one the video will answer — is created by second 10."
    test: "Does the viewer have an unanswered question they want answered before the 10-second mark?"

  viewer_promise_clear:
    description: "By second 30, the viewer understands what they will learn and why it matters to them."
    test: "Could the viewer describe what this video promises before the 30-second mark?"

  proof_or_conflict_in_opening:
    description: "The opening sequence must contain at least one of: institutional clip, document, rule text, named regulator, or human conflict visible under pressure."
    test: "Is there a primary source event before second 30?"

  mechanism_starts_before_second_30:
    description: "The hidden mechanism or chokepoint must begin to become visible before second 30."
    test: "Has the opening established what the hidden structure is, even if not fully explained?"

  pattern_break_in_opening:
    description: "At least one pattern break must occur before second 30."
    test: "Does the opening sequence contain a hard cut to a different visual mode (clip→diagram, diagram→flash, etc.)?"

  visual_state_couples_to_narration:
    description: "Every data point stated in the opening narration has a corresponding visual state change within ±1 second."
    test: "Is there any narration data point with no simultaneous visual event?"

  no_corporate_explainer_feel:
    description: "The opening must not feel like a corporate training video, school presentation, or neutral explainer."
    test: "Would someone mistake this opening for a corporate or academic video?"

---

# Reject criteria — any one triggers automatic rejection
reject_if:
  - starts_with_clean_title_card: "Opening begins with channel name or episode title card as first visual"
  - starts_with_generic_context: "First narration line provides background context before creating tension"
  - first_line_is_you_think: "First line begins with 'You think...' or 'You might think...'"
  - explains_before_tension: "Narration explains the mechanism before establishing conflict or stakes"
  - diagram_before_stakes: "First diagram appears before any clip, proof, or stakes have been established"
  - proof_delayed_past_second_15: "No proof hit, clip, or institutional source appears before second 15"
  - could_belong_to_corporate_training: "Opening is emotionally neutral, institutional-overview in tone"
  - could_belong_to_school_presentation: "Opening walks through context step by step before reaching tension"

---

