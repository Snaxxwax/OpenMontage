# Asymmetric Opening Sequence Proof Template
# Version: 1.0
# One instance per episode. Generate 3-5 variants. At least one must pass all gates before production proceeds.
# Use /om-asymmetric-opening-proof to generate and score variants.
#
# Rule: No script, no research, no clip acquisition, no render may proceed until
# the operator has approved at least one passing opening variant.

