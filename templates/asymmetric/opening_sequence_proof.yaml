    title_direction: ""                # which title candidate this opening pairs with
    thumbnail_direction: ""            # which thumbnail variant (power/mechanism/consequence)
    viewer_promise: ""                 # "By the end of this video you will understand [X] well enough to recognize it in [Y]"

    # --- First frame (t=0) ---
    first_frame: ""                    # exact description of what the viewer sees at t=0
                                       # must be: conflict_clip | proof_document | number_slam | animated_map_start
                                       # must NOT be: title_card | logo | empty_background | slow_fade_in
    first_visual_mode: ""              # conflict_clip | proof_document | hard_text_flash | animated_diagram | number_slam

    # --- Hook mechanics ---
    hook_type: ""                      # conflict_in_progress | consequence_first | mechanism_contradiction | question_gap | stakes_announcement | false_choice_reveal
    first_narration_line: ""           # exact first line of narration — must be speakable in under 4 seconds
    first_text_flash: ""               # 2-5 word text flash if used; empty if opening begins with clip
    source_or_proof_used: ""           # what primary source appears first in this opening

    # --- Viewer psychology ---
    viewer_question_created: ""        # what question does the viewer have before second 10?
    stakes_created_early: false        # true if stakes (person, number, institution) appear before second 8
    viewer_promise_clear: false        # true if viewer can state what the video promises before second 30
    first_proof_or_conflict: false     # true if clip, document, or institutional source appears before second 15
    story_locked_by_second_30: false   # true if open loop is explicit and mechanism has begun

    # --- Retention mechanics ---
    visual_state_changes_by_second_30: 0        # count of meaningful visual state changes before t=30
    pattern_breaks_by_second_30: 0              # count of pattern breaks before t=30
    first_proof_hit_timestamp_seconds: null     # when does first proof hit occur?
    visual_narration_coupled: false             # true if every data point has simultaneous visual event

    # --- Competitive evaluation ---
    why_this_stops_scroll: ""          # one sentence: what makes a scrolling viewer stop at t=0?
    why_this_keeps_viewing: ""         # one sentence: what makes the viewer stay past t=30?
    risk: ""                           # what could go wrong with this opening? be honest.

    # --- Rejection checks ---
