identity:
  name: "Modern Archivist"
  category: cinematic
  mood: "cinematic, investigative, ominous, sharp, curious, slightly paranoid"
  pace: deliberate
  best_for: "Thesis-driven internet documentary / corporate failure essay — YouTube long-form, 10–20 min, high-retention"

visual_language:
  color_palette:
    primary: ["#0F1117", "#1E2330"]
    accent: ["#00CEC9", "#E53935"]
    background: "#0F1117"
    text: "#F0F2F5"
    muted: "rgba(240,242,245,0.55)"
  composition: "dark editorial, evidence-board spatial logic, 2.5D parallax depth, mystery-first framing"
  texture: "subtle film grain on composite frames, clean flat on UI/card layers"

typography:
  headings:
    font: "Barlow Condensed"
    weight: 800
    tracking: "-0.01em"
  body:
    font: "Inter"
    weight: 400
    line_height: 1.6
  code:
    font: "JetBrains Mono"
    weight: 400
  stat_card:
    font: "Barlow Condensed"
    weight: 900
    size_multiplier: 3.5
  scale_system: "major_third"
  weight_matrix:
    title: 900
    heading: 800
    body: 400
    caption: 500

motion:
  transitions: [cut, slow-push, cross-dissolve, flash-frame]
  animation_style: "weighted and purposeful — arrivals have gravity, not bounce; slow push-in on damning quotes"
  pacing_rules:
    min_scene_hold_seconds: 3.5
    max_scene_hold_seconds: 10.0
    text_card_hold_seconds: 4.0
    stat_card_hold_seconds: 4.5
    transition_duration_seconds: 0.3
    # New Performance Metrics
    total_motion_changes_per_minute: 12
    visual_beat_frequency_seconds: 4
    source_artifact_coverage_percent: 70  # Minimum episode time led by source/artifact evidence
    critical_error_time_limit_seconds: 10
  entrance: "cut or fast cross-dissolve (0.3s); slow push-in (1.5–2.5s) for evidence reveals"
  exit: "cut or fast fade-out (0.25s)"

audio:
  voice_style: "calm investigative essayist — controlled, curious, skeptical, occasionally dry or cutting; sounds like uncovering something, not teaching a class"
  music_mood: "dark ambient drone with subtle tension build — no melody, low register, escalates beneath narration, silence before major reveals"
  music_volume: 0.12
  sfx_style: "sparse — hard cuts, soft UI sounds on evidence reveals, deliberate silence before major beats"
  ducking_threshold_db: -12
  narration:
    # New Audio Performance Metrics
    words_per_minute: 120  # Optimal speech rate
    pause_frequency_seconds: 45  # Maximum time between meaningful pauses
    dynamic_range_db: 6  # Maximum allowed volume variation

asset_generation:
  image_prompt_prefix: >
    High-engagement cinematic internet documentary frame, dark case-file aesthetic,
    dramatic evidence-board composition, charcoal (#0F1117) and slate (#1E2330) palette,
    signal teal (#00CEC9) UI glow, red (#E53935) warning accents, archival screenshots,
    floating documents, subtle film grain, 2.5D parallax depth, ominous editorial lighting,
    sharp Barlow Condensed typography, mysterious but credible,
    designed for YouTube retention, not corporate explainer style.
  image_negative_prompt: "bright, colorful, playful, cartoonish, stock photo cheerful, corporate clean, tutorial diagram, whiteboard"
  diagram_style: "teal lines on near-black background, monospace labels, case-file authority"
  consistency_anchors:
    - "Near-black background (#0F1117) throughout — never white, never neutral grey"
    - "Signal teal (#00CEC9) for UI glows, interface elements, and digital artifact reveals"
    - "Red (#E53935) for evidence warnings, contradictions, and critical-error moments — use sparingly"
    - "Slate (#1E2330) for card and panel backgrounds"
    - "Barlow Condensed 800–900 for all title cards and section markers"
    - "2.5D parallax depth on composite frames"
    - "Subtle film grain on footage layers — never on clean UI elements"
    - "Documentary tension in every frame — not decoration"

overlays:
  stat_card:
    bg: "#1E2330"
    border: "#00CEC9"
    text: "#F0F2F5"
    shadow: "0 4px 32px rgba(0,0,0,0.7)"
  key_term:
    bg: "rgba(0,206,201,0.12)"
    border: "#00CEC9"
    text: "#F0F2F5"
    radius: 3
  code_block:
    bg: "#0a0a0a"
    text: "rgba(240,242,245,0.85)"
    highlight: "#00CEC9"

quality_rules:
  - "Cold open must create an unanswered question within the first 20 seconds — open with stakes, not context"
  - "Do not begin narration with definitions, 'In today's video', 'First, let's', or 'To understand this, we need to go back'"
  - "New tension element — money, ego, power, collapse, deception, or contradiction — every 60–90 seconds"
  - "Major evidence reveal every 45–90 seconds; timed as a payoff moment, not a slide transition"
  - "Red state (STATE_CRITICAL_ERROR) is scarce: 3–12 seconds maximum unless operator approves longer"
  - "Every document, screenshot, or filing must become a scene — motion plan required (crop, push, reveal, highlight, quote extraction)"
  - "No dead narration over static visuals — every 4–8 seconds a new visual beat"
  - "Subtitles required on all narration"
  - "Minimum contrast ratio 4.5:1 for all text"
  - "Teal (#00CEC9) reserved for digital/interface elements and digital artifact reveals"
  - "Red (#E53935) reserved for contradictions, warnings, and collapse moments"

chart_palette:
  - "#00CEC9"
  - "#E53935"
  - "#F0F2F5"
  - "#F39C12"
  - "#888E9B"