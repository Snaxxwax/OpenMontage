id: asymmetric
name: Asymmetric
identity:
  channel_type: education_led_ai_security_investigation
  promise: source_led_investigations_that_teach_reusable_lenses
voice:
  tone:
    - forensic
    - controlled
    - unsentimental
    - direct
  avoid:
    - hype
    - tutorializing exploits
    - gossip voice
visual_language:
  palette:
    background: "#0b0d12"
    panel: "#12161f"
    text: "#e6edf6"
    muted: "#94a0b4"
    receipt: "#d6dde8"
    amber_chokepoint: "#f2a93b"
    cyan_system_path: "#56c6d6"
    lime_anomaly: "#9ad94f"
    danger: "#de5a63"
  motifs:
    - receipt_wall
    - dossier_frame
    - timeline_pressure_bar
    - source_label_tags
    - trust_boundary_highlights
typography:
  display: condensed_grotesk
  body: neutral_sans
  captions: mono_ui
motion:
  style:
    - kinetic_but_restrained
    - evidence_first
    - chapter_card_reveals
    - timeline_escalation
audio:
  bed:
    - low_pulse
    - restrained_tension
  cues:
    - hard_cut_on_receipt
    - silence_before_key_reveal
    - ui_tick_for_annotations
overlays:
  required:
    - source_label
    - claim_status
    - date_or_timeline_anchor
  claim_status_values:
    - confirmed
    - researcher_reported
    - vendor_stated
    - independently_corroborated
    - unclear
    - unverified
quality_rules:
  - every sequence must orient the viewer to the claim status
  - visuals should reinforce mechanism, not just mood
  - each episode must end with a named lens
