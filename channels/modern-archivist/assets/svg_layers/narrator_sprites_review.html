<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Narrator Sprites — Review</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; font-family: 'Courier New', monospace; padding: 32px 24px; color: #aaa; }
h2 { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: #556; margin-bottom: 24px; }
.group { margin-bottom: 40px; }
.group-label { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #00aaaa; border-bottom: 1px solid #1a1a1a; padding-bottom: 6px; margin-bottom: 14px; }
.grid { display: flex; flex-wrap: wrap; gap: 12px; }
.card { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.thumb {
  background: repeating-conic-gradient(#1e1e1e 0% 25%, #2a2a2a 0% 50%) 0 0 / 12px 12px;
  border: 1px solid #2a2a2a;
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.thumb img { display: block; object-fit: contain; }
.name { font-size: 7px; color: #556; letter-spacing: 1px; text-align: center; max-width: 140px; }
.missing { font-size: 7px; color: #aa3333; }
</style>
</head>
<body>
<h2>Narrator Sprites — Extracted Assets Review</h2>

<script>
const groups = [
  {
    label: "Body Parts (narrator_head_tilt)",
    size: [140, 140],
    sprites: [
      "narrator_head", "narrator_torso", "narrator_waist_hips",
      "narrator_arm_upper_left", "narrator_arm_forearm_left", "narrator_hand_left",
      "narrator_arm_upper_right", "narrator_arm_forearm_right", "narrator_hand_right",
      "narrator_leg_left", "narrator_leg_right", "narrator_boot_left", "narrator_boot_right"
    ]
  },
  {
    label: "Eyes (narrator_bowing)",
    size: [200, 90],
    sprites: [
      "narrator_eyes_open", "narrator_eyes_half_lid", "narrator_eyes_closed",
      "narrator_eyes_look_left", "narrator_eyes_look_right"
    ]
  },
  {
    label: "Brows (narrator_bowing)",
    size: [200, 70],
    sprites: [
      "narrator_brows_neutral", "narrator_brows_skeptical", "narrator_brows_furrowed"
    ]
  },
  {
    label: "Mouths (narrator_bowing)",
    size: [160, 80],
    sprites: [
      "narrator_mouth_closed", "narrator_mouth_small_open", "narrator_mouth_open",
      "narrator_mouth_wide_open", "narrator_mouth_o", "narrator_mouth_flat", "narrator_mouth_smirk"
    ]
  },
  {
    label: "Arm Gestures (narrator_saluting)",
    size: [220, 90],
    sprites: [
      "narrator_arm_point_left", "narrator_arm_point_right",
      "narrator_arm_present_left", "narrator_arm_present_right",
      "narrator_arm_mug_left", "narrator_arm_mug_both", "narrator_arm_mug_right",
      "narrator_arm_folder_left", "narrator_arm_folder_right",
      "narrator_arm_open_left", "narrator_arm_open_right"
    ]
  },
  {
    label: "Hair & Accessories (narrator_clapping)",
    size: [140, 140],
    sprites: [
      "narrator_hair_back", "narrator_hair_bangs",
      "narrator_hair_curl_left", "narrator_hair_curl_right",
      "narrator_glasses_frame", "narrator_glasses_lenses",
      "narrator_prop_mug", "narrator_prop_folder", "narrator_prop_papers"
    ]
  }
];

for (const g of groups) {
  const section = document.createElement('div');
  section.className = 'group';
  section.innerHTML = `<div class="group-label">${g.label}</div>`;
  const grid = document.createElement('div');
  grid.className = 'grid';
  const [tw, th] = g.size;
  for (const name of g.sprites) {
    const src = `/layers/narrator/${name}.png`;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb" style="width:${tw}px;height:${th}px;">
        <img src="${src}" style="max-width:${tw-4}px;max-height:${th-4}px;"
             onerror="this.parentNode.innerHTML='<span class=missing>404</span>'" />
      </div>
      <div class="name">${name.replace('narrator_', '')}</div>`;
    grid.appendChild(card);
  }
  section.appendChild(grid);
  document.body.appendChild(section);
}
</script>
</body>
</html>
