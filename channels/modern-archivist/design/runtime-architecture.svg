<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Modern Archivist Runtime Architecture</title>
  <desc id="desc">Source and artifact first Modern Archivist pipeline with Remotion final assembly, optional HyperFrames segment renders, local asset staging, quality gates, and final delivery.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.65"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#67e8f9"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .bg { fill: #020617; }
      .title { fill: #f8fafc; font: 700 34px 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
      .subtitle { fill: #94a3b8; font: 16px 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
      .section { fill: rgba(15,23,42,0.78); stroke: #334155; stroke-width: 1.5; rx: 18; }
      .section-title { fill: #cbd5e1; font: 700 15px 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; letter-spacing: .08em; }
      .node-title { fill: #f8fafc; font: 700 16px 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
      .node-sub { fill: #cbd5e1; font: 11px 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
      .tiny { fill: #94a3b8; font: 10px 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
      .stage-bg { fill: #0f172a; stroke-width: 0; }
      .stage { fill: rgba(8,51,68,0.42); stroke: #22d3ee; stroke-width: 1.5; rx: 9; filter: url(#shadow); }
      .artifact { fill: rgba(76,29,149,0.42); stroke: #a78bfa; stroke-width: 1.5; rx: 9; filter: url(#shadow); }
      .runtime { fill: rgba(120,53,15,0.35); stroke: #fbbf24; stroke-width: 1.5; rx: 9; filter: url(#shadow); }
      .review { fill: rgba(136,19,55,0.38); stroke: #fb7185; stroke-width: 1.5; rx: 9; filter: url(#shadow); }
      .delivery { fill: rgba(6,78,59,0.42); stroke: #34d399; stroke-width: 1.5; rx: 9; filter: url(#shadow); }
      .arrow { fill: none; stroke: #67e8f9; stroke-width: 2.2; marker-end: url(#arrow); opacity: 0.86; }
      .arrow-amber { fill: none; stroke: #fbbf24; stroke-width: 2.2; marker-end: url(#arrowAmber); opacity: 0.9; stroke-dasharray: 7 5; }
      .arrow-review { fill: none; stroke: #fb7185; stroke-width: 2; marker-end: url(#arrow); opacity: 0.75; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.9"/>

  <text x="70" y="70" class="title">Modern Archivist Runtime Architecture</text>
  <text x="70" y="102" class="subtitle">Source/artifact-first production, declared mixed-runtime segments, Remotion final assembly</text>

  <rect x="50" y="140" width="385" height="660" class="section"/>
  <text x="78" y="174" class="section-title">PIPELINE STAGES</text>

  <rect x="82" y="210" width="320" height="74" class="stage-bg" rx="9"/><rect x="82" y="210" width="320" height="74" class="stage"/>
  <text x="106" y="238" class="node-title">Research packet</text>
  <text x="106" y="260" class="node-sub">claims, sources, evidence map</text>

  <rect x="82" y="320" width="320" height="82" class="stage-bg" rx="9"/><rect x="82" y="320" width="320" height="82" class="stage"/>
  <text x="106" y="348" class="node-title">Content collection</text>
  <text x="106" y="370" class="node-sub">source footage, artifacts, UI recreation</text>
  <text x="106" y="388" class="tiny">scores + rights + runtime_affinity</text>

  <rect x="82" y="438" width="320" height="82" class="stage-bg" rx="9"/><rect x="82" y="438" width="320" height="82" class="stage"/>
  <text x="106" y="466" class="node-title">Script + media plan</text>
  <text x="106" y="488" class="node-sub">beats reference content_opportunity_refs</text>
  <text x="106" y="506" class="tiny">no document-heavy fallback by default</text>

  <rect x="82" y="556" width="320" height="82" class="stage-bg" rx="9"/><rect x="82" y="556" width="320" height="82" class="stage"/>
  <text x="106" y="584" class="node-title">Narration + timing</text>
  <text x="106" y="606" class="node-sub">TTS, audio probe, section alignment</text>
  <text x="106" y="624" class="tiny">puppet timing locks after audio</text>

  <rect x="82" y="674" width="320" height="74" class="stage-bg" rx="9"/><rect x="82" y="674" width="320" height="74" class="stage"/>
  <text x="106" y="702" class="node-title">Render + QC</text>
  <text x="106" y="724" class="node-sub">plate/final render, evidence/render gates</text>

  <path d="M242 284 L242 314" class="arrow"/>
  <path d="M242 402 L242 432" class="arrow"/>
  <path d="M242 520 L242 550" class="arrow"/>
  <path d="M242 638 L242 668" class="arrow"/>

  <rect x="485" y="140" width="415" height="660" class="section"/>
  <text x="513" y="174" class="section-title">ARTIFACTS + CACHE</text>

  <rect x="520" y="220" width="340" height="88" class="artifact"/>
  <text x="546" y="250" class="node-title">content_collection.json</text>
  <text x="546" y="272" class="node-sub">canonical opportunity IDs</text>
  <text x="546" y="290" class="tiny">rights_status, local_assets, segment_render</text>

  <rect x="520" y="354" width="340" height="88" class="artifact"/>
  <text x="546" y="384" class="node-title">Deterministic asset staging</text>
  <text x="546" y="406" class="node-sub">safe paths under project assets</text>
  <text x="546" y="424" class="tiny">sha256 + asset_manifest records</text>

  <rect x="520" y="488" width="340" height="88" class="artifact"/>
  <text x="546" y="518" class="node-title">Background/source plates</text>
  <text x="546" y="540" class="node-sub">flattened source-heavy scenes</text>
  <text x="546" y="558" class="tiny">optional high-quality mezzanine cache</text>

  <rect x="520" y="622" width="340" height="88" class="artifact"/>
  <text x="546" y="652" class="node-title">episode + media_manifest</text>
  <text x="546" y="674" class="node-sub">resolved content_opportunity_refs</text>
  <text x="546" y="692" class="tiny">render props consume local assets only</text>

  <path d="M402 361 C455 361 465 264 512 264" class="arrow"/>
  <path d="M690 308 L690 348" class="arrow"/>
  <path d="M690 442 L690 482" class="arrow"/>
  <path d="M690 576 L690 616" class="arrow"/>
  <path d="M402 479 C455 479 465 666 512 666" class="arrow"/>

  <rect x="950" y="140" width="595" height="360" class="section"/>
  <text x="978" y="174" class="section-title">DECLARED RUNTIMES</text>

  <rect x="990" y="220" width="230" height="92" class="runtime"/>
  <text x="1016" y="250" class="node-title">Remotion / React</text>
  <text x="1016" y="272" class="node-sub">canonical final assembler</text>
  <text x="1016" y="290" class="tiny">timing, captions, puppet, mux</text>

  <rect x="1270" y="220" width="230" height="92" class="runtime"/>
  <text x="1296" y="250" class="node-title">HyperFrames</text>
  <text x="1296" y="272" class="node-sub">approved segment renderer</text>
  <text x="1296" y="290" class="tiny">premium UI / kinetic inserts</text>

  <rect x="990" y="360" width="230" height="82" class="runtime"/>
  <text x="1016" y="390" class="node-title">FFmpeg utility</text>
  <text x="1016" y="412" class="node-sub">probe, trim, mux, normalize</text>

  <rect x="1270" y="360" width="230" height="82" class="review"/>
  <text x="1296" y="390" class="node-title">Runtime guardrail</text>
  <text x="1296" y="412" class="node-sub">no hidden swaps / paradigm changes</text>

  <path d="M860 398 C905 398 930 266 982 266" class="arrow"/>
  <path d="M860 532 C925 532 1215 266 1262 266" class="arrow-amber"/>
  <path d="M1385 312 L1385 354" class="arrow-review"/>
  <path d="M1220 266 L1262 266" class="arrow-amber"/>

  <rect x="950" y="545" width="595" height="255" class="section"/>
  <text x="978" y="579" class="section-title">FINAL ASSEMBLY + QUALITY GATES</text>

  <rect x="990" y="620" width="235" height="90" class="delivery"/>
  <text x="1016" y="650" class="node-title">Final overlay pass</text>
  <text x="1016" y="672" class="node-sub">source plate + puppet + captions</text>
  <text x="1016" y="690" class="tiny">puppet rendered late after timing lock</text>

  <rect x="1270" y="620" width="235" height="90" class="review"/>
  <text x="1296" y="650" class="node-title">Review gates</text>
  <text x="1296" y="672" class="node-sub">evidence, visual identity, render QC</text>
  <text x="1296" y="690" class="tiny">blocks unsupported/missing refs</text>

  <rect x="1130" y="745" width="235" height="70" class="delivery"/>
  <text x="1156" y="774" class="node-title">Delivery MP4</text>
  <text x="1156" y="796" class="node-sub">verified by ffprobe + QC report</text>

  <path d="M860 666 C920 666 940 666 982 666" class="arrow"/>
  <path d="M1225 666 L1262 666" class="arrow-review"/>
  <path d="M1388 710 C1388 742 1348 780 1372 780" class="arrow-review"/>
  <path d="M1110 710 C1110 742 1125 780 1122 780" class="arrow"/>

  <rect x="70" y="850" width="1460" height="125" fill="rgba(15,23,42,0.72)" stroke="#334155" stroke-width="1.2" rx="14"/>
  <text x="100" y="885" class="node-title">Operational rule</text>
  <text x="100" y="912" class="node-sub">Plan puppet layout early; render/cache source-heavy content and approved segment renders first.</text>
  <text x="100" y="936" class="node-sub">Render puppet/captions late in Remotion final assembly after narration and timings are locked.</text>
  <text x="100" y="960" class="tiny">Root diagram.png was removed because it was a generic empty placeholder; this channel-local SVG is the source-controlled runtime reference.</text>
</svg>
