name: modern-archivist
version: '1.0'
description: 'Channel-specific OpenMontage pipeline for The Modern Archivist / Failure Ledger: thesis-driven corporate and
  product failure documentaries rendered with deterministic React/Remotion animation, local narration, saved assets first,
  and optional ComfyUI only as a reviewed source-asset provider.

  '
category: custom
stability: beta
default_checkpoint_policy: guided
reference_input:
  supported: false
metadata:
  channel_package: true
  channel_category: documentary-animation
  lifecycle_stage: alpha
  canonical_renderer: remotion
  composition: ModernArchivist
  artifact_paths:
    research_packet: artifacts/research_packet.json
    episode: artifacts/episode.json
    narration_audio: assets/audio/narration.wav
    audio_analysis: artifacts/audio_analysis.json
    media_manifest: artifacts/media_manifest.json
    asset_manifest: artifacts/asset_manifest.json
    render_report: artifacts/render_report.json
    content_collection: artifacts/content_collection.json
  schemas:
    episode: channels/modern-archivist/schemas/episode.schema.json
    media_manifest: channels/modern-archivist/schemas/media.schema.json
    content_collection: channels/modern-archivist/schemas/content_collection.schema.json
  constraints:
    no_webgl: true
    no_canvas_skeletal_rigging: true
    no_image_to_video_character: true
    deterministic_render_inputs_only: true
    no_network_fetches_during_remotion_render: true
  asset_policy:
    saved_assets_policy: channels/modern-archivist/assets/comfyui_workflows/asset_requirements.yaml
    saved_assets_check: scripts/comfyui/asset_generation_needed.py
    comfyui_lifecycle_tool: scripts/comfyui/ensure_comfyui_docker.py
    deprecated_orchestration_shim: scripts/comfyui/run_asset_generation.py
orchestration:
  mode: executive-producer
  skill: channels/modern-archivist/skills/executive-producer.md
  budget_default_usd: 0.0
  max_revisions_per_stage: 3
  max_send_backs: 2
  max_wall_time_minutes: 60
subagent_policy:
  enabled: true
  decision_owner: executive_producer
  nested_subagents_allowed: false
  max_parallel: 3
  completion_contract_required: true
  main_session_verifies_outputs: true
  blocker_handling: surface_to_operator
extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: false
required_skills:
- channels/modern-archivist/skills/executive-producer.md
- channels/modern-archivist/skills/research-director.md
- channels/modern-archivist/skills/content-collection-director.md
- channels/modern-archivist/skills/script-director.md
- channels/modern-archivist/skills/audio-director.md
- channels/modern-archivist/skills/audio-analysis-director.md
- channels/modern-archivist/skills/media-director.md
- channels/modern-archivist/skills/asset-generation-director.md
- channels/modern-archivist/skills/render-director.md
- channels/modern-archivist/skills/review/evidence-auditor.md
- channels/modern-archivist/skills/review/failure-thesis-critic.md
- channels/modern-archivist/skills/review/voice-consistency-critic.md
- channels/modern-archivist/skills/review/visual-identity-reviewer.md
- channels/modern-archivist/skills/review/render-qc-reviewer.md
- meta/reviewer
- meta/checkpoint-protocol
compatible_playbooks:
  recommended:
  - broadcast-investigative
  - flat-motion-graphics
  also_works:
  - clean-professional
  - minimalist-diagram
  custom_allowed: true
stages:
- name: research
  skill: channels/modern-archivist/skills/research-director.md
  produces:
  - research_packet
  tools_available: []
  checkpoint_required: true
  human_approval_default: false
  review_focus:
  - Claims are evidence-ranked and separated from interpretation
  - Corporate/product timeline contains dated primary-source anchors
  - Failure thesis is specific, falsifiable, and not generic outrage
  - URLs, publishers, retrieval dates, and notes are present for sources
  success_criteria:
  - Schema-valid or contract-valid research_packet artifact exists at artifacts/research_packet.json
  - Sources include URLs and retrieval dates
  - Claims are grouped by evidence strength and narrative relevance
  - Open questions and risky claims are explicitly marked
  subagents:
  - name: evidence_auditor
    skill: channels/modern-archivist/skills/review/evidence-auditor.md
    mode: blocking
    trigger: after_stage_output
    required_artifacts_in:
    - research_packet
    produces:
    - artifacts/reviews/evidence_audit.md
    completion_contract: agent_gate_report
    review_focus:
    - Every high-strength claim traces to a named source with URL or document reference
    - Interpretation is labeled separately from what the record proves
    - Corporate/product timeline anchors are dated and source-backed
    - Risky or unsourced claims are blocked, downgraded, or cut
- name: content_collection
  skill: channels/modern-archivist/skills/content-collection-director.md
  required_artifacts_in:
  - research_packet
  produces:
  - content_collection
  tools_available: []
  checkpoint_required: true
  human_approval_default: false
  review_focus:
  - Source footage, public video, archived web, product UI, or recreated artifact opportunities are identified before scriptwriting
  - Documents, filings and charts are treated as evidence moments, not the main visual surface
  - Topic passes at least three of five greenlight criteria or is explicitly parked/rejected
  - Every visual opportunity records provenance, rights_status, evidence_role, runtime_affinity, and intended script use
  - HyperFrames candidates are flagged for source-rich motion sequences without replacing Remotion final assembly
  success_criteria:
  - Schema-valid content_collection artifact exists at artifacts/content_collection.json
  - Coverage report classifies visual feasibility and boring_visual_risk
  - Reject or park a topic if it only has filings and charts
- name: script
  skill: channels/modern-archivist/skills/script-director.md
  required_artifacts_in:
  - research_packet
  - content_collection
  produces:
  - episode
  tools_available: []
  checkpoint_required: true
  human_approval_default: true
  review_focus:
  - Hook promises a corporate autopsy, not a generic explainer
  - Narration fits the target duration and Modern Archivist voice
  - Scene beats map to visual slots and deterministic render states
  - Claims in narration trace back to research_packet evidence IDs
  - Episode contains structured retention timeline fields
  - Hook, stakes, and character returns are explicit
  - Red critical-error beats are scarce and justified
  - Every factual beat has evidence refs
  - Script scenes use content_collection opportunity IDs for visual-dependent beats
  - Source-footage/artifact-first opportunities shape the cold open and act breaks
  success_criteria:
  - Schema-valid episode artifact exists at artifacts/episode.json
  - Narration duration is within target range
  - Every scene has a visual slot, state tag, and evidence linkage where factual
  - User approval or approved-with-changes is recorded before audio
  - Structured retention timeline fields validate against the channel episode schema
  - Hook, stakes, character returns, and visual modes are explicit
  - Red critical-error beats are scarce and justified
  - Every factual beat has evidence refs
  - Visual-dependent scenes map to content_collection opportunity IDs
  - Document-only beats are compressed into receipt moments or rewritten as artifact scenes
  subagents:
  - name: failure_thesis_critic
    skill: channels/modern-archivist/skills/review/failure-thesis-critic.md
    mode: blocking
    trigger: before_human_approval
    required_artifacts_in:
    - research_packet
    - episode
    produces:
    - artifacts/reviews/failure_thesis_review.md
    completion_contract: agent_gate_report
    human_approval_default: true
    review_focus:
    - Episode frames a specific failure mechanism rather than a generic explainer topic
    - Hook promises a corporate autopsy with stakes, culprit, mechanism, and cost
    - Payoff delivers a reusable failure pattern instead of a summary
    - Narrative avoids outrage, hype, and unsupported blame
  - name: voice_consistency_critic
    skill: channels/modern-archivist/skills/review/voice-consistency-critic.md
    mode: blocking
    trigger: before_human_approval
    required_artifacts_in:
    - research_packet
    - episode
    produces:
    - artifacts/reviews/voice_consistency_review.md
    completion_contract: agent_gate_report
    human_approval_default: true
    review_focus:
    - Narration preserves dry Modern Archivist skepticism
    - Sentences are speakable with local Fish Speech delivery
    - Filler transitions, hype, AI-sludge, and generic business language are removed
    - Evidence citations remain audible and non-intrusive
- name: audio
  skill: channels/modern-archivist/skills/audio-director.md
  required_artifacts_in:
  - episode
  produces:
  - narration_audio
  required_tools:
  - tts_selector
  tools_available:
  - tts_selector
  - fish_speech_tts
  - piper_tts
  - openai_tts
  - google_tts
  - elevenlabs_tts
  - audio_mixer
  - audio_probe
  checkpoint_required: false
  human_approval_default: false
  review_focus:
  - Voice and pacing match the approved script
  - Generated files are local and deterministic inputs for later stages
  - GPU service decisions are not hidden in Python orchestration
  success_criteria:
  - assets/audio/narration.wav exists
  - audio_probe validates the narration audio
  - Duration matches script timing within tolerance
- name: audio_analysis
  skill: channels/modern-archivist/skills/audio-analysis-director.md
  required_artifacts_in:
  - narration_audio
  produces:
  - audio_analysis
  tools_available:
  - audio_probe
  - audio_energy
  checkpoint_required: false
  human_approval_default: false
  review_focus:
  - Word timings are normalized for Remotion props
  - Amplitude samples are precomputed; render does no live analysis
  - Analysis references the exact narration file produced by audio
  success_criteria:
  - artifacts/audio_analysis.json exists
  - Word timings and amplitude samples are normalized
  - No render-time audio analysis is required
- name: media_manifest
  skill: channels/modern-archivist/skills/media-director.md
  required_artifacts_in:
  - episode
  - research_packet
  produces:
  - media_manifest
  tools_available: []
  checkpoint_required: true
  human_approval_default: false
  review_focus:
  - Every visual asset requirement has provenance or an explicit creation plan
  - No network fetches are required during Remotion render
  - Visual choices support the Failure Ledger / corporate autopsy framing
  - Media plan uses case-file/editorial sequences rather than long static receipts
  - Illustrative material is labeled and separated from evidence
  - Motion plans exist for source-heavy visuals
  success_criteria:
  - Schema-valid media_manifest artifact exists at artifacts/media_manifest.json
  - Every visual asset has provenance, path, or planned local generation source
  - Render inputs are local files or inline deterministic data
  - Media plan uses case-file/editorial sequences rather than long static receipts
  - Illustrative material is labeled and separated from evidence
  - Motion plans exist for source-heavy visuals
  subagents:
  - name: visual_identity_reviewer
    skill: channels/modern-archivist/skills/review/visual-identity-reviewer.md
    mode: advisory
    trigger: after_stage_output
    required_artifacts_in:
    - episode
    - research_packet
    - media_manifest
    produces:
    - artifacts/reviews/visual_identity_review.md
    completion_contract: agent_gate_report
    review_focus:
    - Asset requests support thesis-driven corporate autopsy frames, not decoration
    - Color, typography, source labels, and proof cards stay consistent across scenes
    - Generated assets remain optional and review-gated before promotion
- name: asset_generation
  skill: channels/modern-archivist/skills/asset-generation-director.md
  required_artifacts_in:
  - episode
  - media_manifest
  produces:
  - asset_manifest
  optional_tools:
  - image_selector
  - local_diffusion
  tools_available:
  - image_selector
  - image_gen
  - local_diffusion
  - openai_image
  - google_imagen
  - grok_image
  checkpoint_required: true
  human_approval_default: true
  review_focus:
  - Saved-assets check runs before any ComfyUI lifecycle command
  - ComfyUI is skipped if saved assets satisfy the requested profile
  - Provider/model/workflow choice is proposed by the stage director, not Python
  - Generated assets are not auto-promoted without review and approval
  - run_asset_generation.py is not used as pipeline orchestration
  success_criteria:
  - artifacts/asset_manifest.json exists
  - Saved-assets check result is recorded in asset_manifest
  - ComfyUI was skipped when saved assets were sufficient
  - Any generated candidate includes workflow/model/seed/provenance metadata
  - Selected/generated assets are reviewed before promotion
- name: render
  skill: channels/modern-archivist/skills/render-director.md
  required_artifacts_in:
  - episode
  - media_manifest
  - asset_manifest
  - audio_analysis
  produces:
  - render_report
  required_tools:
  - video_compose
  optional_tools:
  - hyperframes_compose
  tools_available:
  - video_compose
  - hyperframes_compose
  - remotion_caption_burn
  - video_stitch
  - audio_probe
  checkpoint_required: true
  human_approval_default: false
  review_focus:
  - Render uses deterministic local props only
  - Remotion remains the canonical runtime unless user approves a material change
  - HyperFrames is included in the runtime shortlist when available and must not be silently substituted
  - Output file, duration, audio sync, and keyframes are verified
  - Final render uses visual variety and character returns as planned
  - Render report notes visual modes used and any deviations
  - Motion density and critical-error timing are reviewed against retention doctrine
  success_criteria:
  - Final video file exists
  - audio_probe validates the rendered video
  - render_report records input artifacts, runtime, output path, duration, and verification notes
  - Final render uses visual variety and character returns as planned
  - Render report notes visual modes used and any deviations
  - Motion density and critical-error timing are reviewed against retention doctrine
  subagents:
  - name: render_qc_reviewer
    skill: channels/modern-archivist/skills/review/render-qc-reviewer.md
    mode: blocking
    trigger: after_stage_output
    required_artifacts_in:
    - episode
    - media_manifest
    - asset_manifest
    - audio_analysis
    - render_report
    produces:
    - artifacts/reviews/render_qc_review.md
    completion_contract: agent_gate_report
    review_focus:
    - Render output exists and matches render_report path, duration, and runtime
    - Audio continuity, loudness, and sync are verified with objective probes
    - Frame samples show no blank screens or source-label collisions
    - Render stays on approved Remotion or explicitly approved HyperFrames path
